name: Android APK + AAB

on:
  push:
    branches: [main, expo]
    # Server list, proposal form and docs do not change the APK.
    paths-ignore:
      - servers.json
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/community-server.yml'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to publish the APK as the repository's single release (pushes to main)

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native package versions with the Expo SDK
        run: npx expo install --fix

      - name: Unit tests (profile parser, settings, translations, server script dry run)
        run: npm test

      - name: ShellCheck server script
        run: shellcheck -x server/zeppelin-oracle-setup.sh tests/server-dry-run.sh

      - name: TypeScript check (informational)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Generate the Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'modules/zeppelin-vpn/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "Keystore restored ($(stat -c %s "$RUNNER_TEMP/upload.keystore") bytes)"

      - name: Build release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing: the APK is signed with the debug key (fine for testing) and the AAB cannot be uploaded to Google Play."
            ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          fi

      - name: Collect outputs and show signing certificate
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/ZeppelinVPN-$VERSION-$CODE.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/ZeppelinVPN-$VERSION-$CODE.aab"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)
          echo "== APK signature =="
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "out/ZeppelinVPN-$VERSION-$CODE.apk" 2>&1 | grep -E "certificate (DN|SHA-256)" || echo "::warning::apksigner could not print the APK certificate (build-tools $BT)"
          echo "== AAB signature =="
          keytool -printcert -jarfile "out/ZeppelinVPN-$VERSION-$CODE.aab" 2>&1 | grep -E "Owner:|SHA256:" | head -2 || true
          ls -la out

      - name: Upload APK (install on the phone)
        uses: actions/upload-artifact@v4
        with:
          name: ZeppelinVPN-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ZeppelinVPN-aab
          path: out/*.aab
          if-no-files-found: error
          retention-days: 14

      # The Releases page always shows exactly one version: the newest signed APK from main.
      # Every older release (including old debug builds) is deleted together with its tag.
      - name: Publish the APK as the only release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning::Signing secrets are missing, so this APK is not signed with your key. No release was published."
            exit 0
          fi
          VERSION=$(node -p "require('./app.json').expo.version")
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          gh release create "v$VERSION" out/*.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Zeppelin VPN $VERSION" \
            --notes "Telefona kurmak için aşağıdaki .apk dosyasını indir. Değişiklikler: docs/DEGISIKLIKLER_TR.md

          Download the .apk below to install on your phone." 
